<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Карта нашей памяти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage" id="stage">

  <!-- ЗВЁЗДЫ -->
  <div id="stars-container"></div>

  <!-- ЭКРАН 1 — СТАРТ -->
  <section class="screen screen--start is-active" data-screen="start">
    <div class="screen__inner">
      <h1 class="title-serif" id="start-greeting">Привет, <span class="name"></span></h1>
      <p class="subtitle" id="start-subtitle"></p>
      <div class="screen-footer">
        <!-- НОВАЯ НЕОНОВАЯ КНОПКА -->
        <button class="btn-start-neon" id="btn-start">
          Начать путешествие
          <span class="icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </span>
        </button>
      </div>
    </div>
  </section>

  <!-- ЭКРАН 2 — КАРТА -->
  <section class="screen screen--map" data-screen="map">
    <div class="screen__inner screen__inner--map">
      <h2 class="title-serif title-serif--sm">Карта памяти</h2>
      <div class="map-wrapper neu-card">
        <div class="map-viewport">
          <div class="map-content" id="mapContent">
            <svg class="map-svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid meet" id="mapSvg"></svg>
            <div class="map-nodes" id="mapNodes"></div>
          </div>
        </div>
      </div>
      <div class="map-legend">
        <span class="legend-dot legend-dot--available"></span> Доступно
        <span class="legend-dot legend-dot--done"></span> Пройдено
        <span class="legend-dot legend-dot--locked"></span> Закрыто
      </div>
    </div>
  </section>

  <!-- ЭКРАН 3 — УРОВЕНЬ -->
  <section class="screen screen--level" data-screen="level">
    <div class="screen__inner screen__inner--level">
      <div class="level-header">
        <span class="level-counter" id="levelCounter"></span>
        <span class="level-caption" id="levelCaption"></span>
      </div>
      <!-- СТОПКА ФОТО (ПОЛАРОИД) -->
      <div class="photo-stack" id="level-photo-stack">
        <div class="photo-stack-card" id="level-photo-frame">
          <img id="level-photo" alt="">
        </div>
        <div class="photo-stack-card" style="background:#F7F0E6; border:2px dashed #D5C8B8; display:flex; align-items:center; justify-content:center; color:#B8A898; font-size:12px; padding:8px;">
          <span style="transform:rotate(-5deg);">📸</span>
        </div>
      </div>
      <p class="level-date" id="levelDate"></p>
      <p class="level-question" id="levelQuestion"></p>
      <div class="level-options" id="levelOptions"></div>
      <div class="level-answer" id="levelAnswer">
        <p class="level-memory" id="levelMemory"></p>
        <div class="screen-footer">
          <button class="btn btn--ghost" id="btn-level-continue">Продолжить путь</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ЭКРАН 3.5 — СЕКРЕТНЫЙ КОНВЕРТ -->
  <section class="screen screen--envelope" data-screen="envelope">
    <div class="screen__inner screen__inner--envelope">
      <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="envelope" id="envelope">
          <div class="envelope__flap" id="envelopeFlap"></div>
          <div class="envelope__body">
            <span class="envelope__heart">❤</span>
          </div>
        </div>
      </div>
      <div class="letter-full" id="letterFull">
        <div class="letter-full__content neu-card">
          <p class="letter-full__text" id="letterText"></p>
          <button class="btn btn--primary letter-full__btn" id="letterBtn">Дальше</button>
        </div>
      </div>
      <p class="envelope-hint" id="envelopeHint">Нажми на конверт, чтобы открыть</p>
    </div>
  </section>

  <!-- ЭКРАН 4 — ПОДАРКИ -->
  <section class="screen screen--gifts" data-screen="gifts">
    <div class="screen__inner screen__inner--gifts">
      <h2 class="title-serif title-serif--sm">Выбери свой подарок</h2>
      <div class="heart-field" id="heartField"></div>
      <div class="gifts__reveal" id="giftsReveal">
        <p class="gifts__reveal-text">Твой выбор сделан</p>
        <div class="screen-footer">
          <button class="btn btn--primary" id="btn-see-final">Узнать, что внутри</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ЭКРАН 4.5 — КНИГА ВОСПОМИНАНИЙ -->
  <section class="screen screen--book" data-screen="book">
    <div class="screen__inner screen__inner--book">
      <h2 class="title-serif title-serif--sm">Книга воспоминаний</h2>
      <div class="book-wrapper" id="bookWrapper">
        <div class="book neu-card" id="book">
          <div class="book__pages" id="bookPages"></div>
          <div class="book__nav">
            <button class="btn btn--ghost book__nav-btn" id="bookPrev">←</button>
            <span class="book__nav-counter" id="bookCounter">1 / 4</span>
            <button class="btn btn--ghost book__nav-btn" id="bookNext">→</button>
          </div>
        </div>
      </div>
      <button class="btn btn--primary" id="bookCloseBtn" style="display:none; margin-top: 16px;">Закрыть книгу</button>
    </div>
  </section>

  <!-- ЭКРАН 5 — ФИНАЛ -->
  <section class="screen screen--final" data-screen="final">
    <div class="screen__inner screen__inner--final">
      <div class="photo-frame photo-frame--final" id="finalPhotoFrame">
        <img id="finalPhoto" alt="Подарок">
      </div>
      <h2 class="title-serif" id="finalTitle"></h2>
      <p class="final-message" id="finalMessage"></p>
      <div class="time-counter" id="timeCounterWrapper">
        <p class="time-counter__label">Мы вместе уже</p>
        <p class="time-counter__value" id="timeCounter"></p>
      </div>
    </div>
  </section>

</div>

<canvas id="confetti-canvas" style="position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50;"></canvas>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
